<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunflower of Sorries</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000; /* Pitch black background */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Arial', system-ui, sans-serif;
            overflow: hidden;
        }

        .canvas-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: 0;
        }

        canvas {
            display: block;
            width: min(100vmin, 1200px);
            height: min(100vmin, 1200px);
            max-width: 1000px;
            max-height: 1000px;
            /* Subtle glow */
            filter: drop-shadow(0 0 20px rgba(255, 180, 50, 0.15)); 
            transition: filter 0.3s ease;
        }

        canvas:hover {
            filter: drop-shadow(0 0 35px rgba(255, 200, 80, 0.3));
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0,0,0,0);
            border: 0;
        }
    </style>
</head>
<body>
    <div class="canvas-wrapper">
        <canvas id="sunflowerCanvas" width="1200" height="1200" role="img" aria-label="A realistic sunflower made entirely of the word 'sorry' with a green stem, on a black background">
            Your browser does not support the canvas element.
        </canvas>
        <p class="sr-only">Visual representation: a large sunflower with a green stem on a black background, composed of repeated 'sorry' words.</p>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('sunflowerCanvas');
            const ctx = canvas.getContext('2d');

            // High resolution
            const W = 1200;
            const H = 1200;
            canvas.width = W;
            canvas.height = H;

            // Shift the flower UP slightly to make room for the stem at the bottom
            const cx = W / 2;
            const cy = H / 2 - 80; 
            const scale = W / 1200; 

            // Clear canvas with pure black
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, W, H);

            // ---------- Helper Function ----------
            function drawSorry(x, y, size, fillStyle, rotation = 0, font = 'bold') {
                ctx.save();
                ctx.translate(x, y);
                if (rotation !== 0) {
                    ctx.rotate(rotation);
                }
                ctx.font = `${font} ${size}px 'Segoe UI', 'Arial', 'Helvetica', sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = fillStyle;
                
                ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
                ctx.shadowBlur = 4;
                ctx.shadowOffsetX = 1;
                ctx.shadowOffsetY = 1;
                
                ctx.fillText('sorry', 0, 0);
                ctx.restore();
            }

            // ==========================================
            // 1. THE GREEN STEM ("STICK")
            // ==========================================
            const stemTopY = cy + 100 * scale;
            const stemBottomY = H + 50; // Extends off screen
            const stemWidth = 45 * scale;

            // Draw stem as layered 'sorry's
            // We do multiple vertical strips to give it thickness and texture
            for (let row = 0; row < 80; row++) {
                const progress = row / 80;
                const y = stemTopY + (stemBottomY - stemTopY) * progress;
                
                // Slight curve to the stem
                const curve = Math.sin(progress * Math.PI) * 20 * scale;
                const currentX = cx + curve;

                // Width tapers slightly towards bottom
                const currentWidth = stemWidth * (1 - progress * 0.2);

                // Draw multiple 'sorry's across the width
                const columns = 5;
                for (let col = 0; col < columns; col++) {
                    // Spread across width
                    const xOffset = (col / (columns - 1) - 0.5) * currentWidth;
                    const x = currentX + xOffset + (Math.random() - 0.5) * 8 * scale;
                    const finalY = y + (Math.random() - 0.5) * 15 * scale;

                    // Green colors (dark and natural)
                    const hue = 100 + Math.random() * 25; // 100-125 (greens)
                    const sat = 40 + Math.random() * 30;  // 40-70%
                    const light = 15 + Math.random() * 20; // 15-35% (darker)
                    
                    // Vertical rotation for stem
                    const rot = (Math.random() - 0.5) * 0.2; 
                    
                    drawSorry(x, finalY, 14 * scale, `hsl(${hue}, ${sat}%, ${light}%)`, rot);
                }
            }

            // Add a few tiny leaves on the stem
            // Left leaf
            for (let i = 0; i < 40; i++) {
                const angle = -0.6 + Math.random() * 0.4;
                const dist = 20 + Math.random() * 50 * scale;
                const lx = cx - 30 * scale + Math.cos(angle) * dist;
                const ly = stemTopY + 150 * scale + Math.sin(angle) * dist;
                const hue = 110 + Math.random() * 15;
                drawSorry(lx, ly, 10 * scale, `hsl(${hue}, 60%, 25%)`, angle + Math.PI/2);
            }

            // Right leaf
            for (let i = 0; i < 40; i++) {
                const angle = Math.PI + 0.6 - Math.random() * 0.4;
                const dist = 20 + Math.random() * 50 * scale;
                const lx = cx + 30 * scale + Math.cos(angle) * dist;
                const ly = stemTopY + 250 * scale + Math.sin(angle) * dist;
                const hue = 110 + Math.random() * 15;
                drawSorry(lx, ly, 10 * scale, `hsl(${hue}, 60%, 25%)`, angle - Math.PI/2);
            }


            // ==========================================
            // 2. THE PETALS (MUCH MORE DENSE)
            // ==========================================
            
            // We now have 4 layers of petals with significantly higher counts.

            // Layer 1: Deep Back Petals (Largest, Darkest, Fewer)
            const backPetals = 36;
            for (let i = 0; i < backPetals; i++) {
                const angle = (i / backPetals) * Math.PI * 2 + (Math.PI / backPetals); 
                const petalLength = 490 * scale + (Math.random() * 50 * scale);
                const petalWidth = 90 * scale;
                
                for (let j = 0; j < 30; j++) {
                    const progress = j / 30; 
                    const r = 140 * scale + (petalLength - 140 * scale) * progress;
                    
                    const widthFactor = Math.sin(progress * Math.PI); 
                    const spread = (Math.random() - 0.5) * petalWidth * widthFactor;
                    
                    const perpAngle = angle + Math.PI / 2;
                    const px = cx + Math.cos(angle) * r + Math.cos(perpAngle) * spread;
                    const py = cy + Math.sin(angle) * r + Math.sin(perpAngle) * spread;

                    const hue = 35 + (Math.random() * 8); 
                    const sat = 80 + Math.random() * 15;
                    const light = 40 + Math.random() * 15;
                    
                    drawSorry(px, py, 15 * scale, `hsl(${hue}, ${sat}%, ${light}%)`, angle + (Math.random()-0.5)*0.4);
                }
            }

            // Layer 2: Mid-Back Petals
            const midBackPetals = 40;
            for (let i = 0; i < midBackPetals; i++) {
                const angle = (i / midBackPetals) * Math.PI * 2 + (Math.PI / midBackPetals); 
                const petalLength = 450 * scale + (Math.random() * 40 * scale);
                const petalWidth = 100 * scale;
                
                for (let j = 0; j < 35; j++) {
                    const progress = j / 35; 
                    const r = 130 * scale + (petalLength - 130 * scale) * progress;
                    
                    const widthFactor = Math.sin(progress * Math.PI); 
                    const spread = (Math.random() - 0.5) * petalWidth * widthFactor;
                    
                    const perpAngle = angle + Math.PI / 2;
                    const px = cx + Math.cos(angle) * r + Math.cos(perpAngle) * spread;
                    const py = cy + Math.sin(angle) * r + Math.sin(perpAngle) * spread;

                    const hue = 38 + (Math.random() * 8); 
                    const sat = 85 + Math.random() * 15;
                    const light = 48 + Math.random() * 15;
                    
                    drawSorry(px, py, 16 * scale, `hsl(${hue}, ${sat}%, ${light}%)`, angle + (Math.random()-0.5)*0.3);
                }
            }

            // Layer 3: Main Front Petals (Brightest, Most Dense)
            const mainPetals = 44;
            for (let i = 0; i < mainPetals; i++) {
                const angle = (i / mainPetals) * Math.PI * 2;
                const petalLength = 410 * scale + (Math.random() * 40 * scale);
                const petalWidth = 110 * scale;
                
                for (let j = 0; j < 45; j++) {
                    const progress = j / 45; 
                    const r = 120 * scale + (petalLength - 120 * scale) * progress;
                    
                    const widthFactor = Math.sin(progress * Math.PI); 
                    const spread = (Math.random() - 0.5) * petalWidth * widthFactor;
                    
                    const perpAngle = angle + Math.PI / 2;
                    const px = cx + Math.cos(angle) * r + Math.cos(perpAngle) * spread;
                    const py = cy + Math.sin(angle) * r + Math.sin(perpAngle) * spread;

                    const hue = 42 + (Math.random() * 10); 
                    const sat = 90 + Math.random() * 10;
                    const light = 55 + Math.random() * 15;
                    
                    drawSorry(px, py, 18 * scale, `hsl(${hue}, ${sat}%, ${light}%)`, angle + (Math.random()-0.5)*0.2);
                }
            }

            // Layer 4: Inner Short Petals
            const innerPetals = 32;
            for (let i = 0; i < innerPetals; i++) {
                const angle = (i / innerPetals) * Math.PI * 2 + (Math.PI / innerPetals);
                const petalLength = 280 * scale + (Math.random() * 50 * scale);
                const petalWidth = 80 * scale;
                
                for (let j = 0; j < 30; j++) {
                    const progress = j / 30; 
                    const r = 110 * scale + (petalLength - 110 * scale) * progress;
                    
                    const widthFactor = Math.sin(progress * Math.PI); 
                    const spread = (Math.random() - 0.5) * petalWidth * widthFactor;
                    
                    const perpAngle = angle + Math.PI / 2;
                    const px = cx + Math.cos(angle) * r + Math.cos(perpAngle) * spread;
                    const py = cy + Math.sin(angle) * r + Math.sin(perpAngle) * spread;

                    const hue = 32 + (Math.random() * 8); 
                    const sat = 90 + Math.random() * 10;
                    const light = 50 + Math.random() * 10;
                    
                    drawSorry(px, py, 15 * scale, `hsl(${hue}, ${sat}%, ${light}%)`, angle);
                }
            }

            // ==========================================
            // 3. THE CENTER DISK (Seeds)
            // ==========================================
            const diskRadius = 150 * scale; // Slightly smaller to allow more petals
            
            // Base dark brown disk background
            ctx.beginPath();
            ctx.arc(cx, cy, diskRadius, 0, Math.PI * 2);
            ctx.fillStyle = '#1a0f05';
            ctx.fill();

            // Spiral pattern for seeds
            const totalSeeds = 850;
            for (let i = 0; i < totalSeeds; i++) {
                const goldenAngle = Math.PI * (3 - Math.sqrt(5));
                const angle = i * goldenAngle;
                const r = Math.sqrt(i / totalSeeds) * diskRadius * 0.95;
                
                const x = cx + Math.cos(angle) * r;
                const y = cy + Math.sin(angle) * r;

                const hue = 20 + (Math.random() * 15);
                const sat = 50 + Math.random() * 30;
                const light = 8 + Math.random() * 15;
                
                const size = 7 * scale + (Math.random() * 5 * scale);
                
                drawSorry(x, y, size, `hsl(${hue}, ${sat}%, ${light}%)`, angle);
            }

            // Dense border ring around the center disk
            const borderSeeds = 160;
            for(let i=0; i<borderSeeds; i++) {
                const angle = (i / borderSeeds) * Math.PI * 2;
                const r = diskRadius * (0.97 + Math.random() * 0.06);
                const x = cx + Math.cos(angle) * r;
                const y = cy + Math.sin(angle) * r;
                
                const color = `hsl(25, 60%, ${20 + Math.random() * 15}%)`;
                drawSorry(x, y, 10 * scale, color, angle);
            }

            // ==========================================
            // 4. FLUFFY EDGES & HIGHLIGHTS
            // ==========================================
            // Tiny, bright 'sorry's at the very tips to make the petals look naturally jagged
            for (let i = 0; i < 250; i++) {
                const angle = Math.random() * Math.PI * 2;
                const r = 470 * scale + Math.random() * 50 * scale;
                const x = cx + Math.cos(angle) * r;
                const y = cy + Math.sin(angle) * r;
                
                const color = `hsl(${40 + Math.random() * 12}, 95%, 65%)`;
                drawSorry(x, y, (6 + Math.random() * 7) * scale, color, angle, 'normal');
            }

        })();
    </script>
</body>
</html>
